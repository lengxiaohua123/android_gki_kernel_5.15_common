name: Build GKI with Google Clang

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # 使用 Node 24

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY /usr/local/lib/android
        sudo docker image prune --all --force || true
        df -h

    - name: Setup Swap
      run: |
        sudo swapoff /swapfile 2>/dev/null || true
        sudo rm -f /swapfile
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip curl wget python3 bc rsync \
          cpio ncurses-dev libxml2-utils build-essential \
          flex bison libssl-dev libelf-dev xz-utils

    - name: Cache Google Clang
      uses: actions/cache@v4
      with:
        path: ~/toolchains/clang
        key: google-clang-r450784e-v2

    - name: Download Google Clang
      run: |
        set -e
        CLANG_DIR="$HOME/toolchains/clang"
        
        if [ -f "$CLANG_DIR/bin/clang" ]; then
          echo "Clang already cached"
        else
          echo "Downloading Google Clang..."
          mkdir -p ~/toolchains
          cd ~/toolchains
          
          # 尝试多个镜像
          if wget -q --timeout=60 "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz" -O clang.tar.gz 2>/dev/null; then
            echo "Downloaded from Android"
            mkdir -p clang
            tar -xzf clang.tar.gz -C clang
            rm clang.tar.gz
          elif wget -q --timeout=60 "https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.7/clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04.tar.xz" -O clang.tar.xz 2>/dev/null; then
            echo "Downloaded from GitHub"
            tar -xf clang.tar.xz
            mv clang+llvm-15.0.7-x86_64-linux-gnu-ubuntu-22.04 clang
            rm clang.tar.xz
          else
            echo "ERROR: Failed to download Clang"
            exit 1
          fi
        fi
        
        # 验证
        echo "Clang location: $CLANG_DIR"
        ls -la "$CLANG_DIR/bin/" | head -5
        "$CLANG_DIR/bin/clang" --version
        
        echo "CLANG_PATH=$CLANG_DIR/bin" >> $GITHUB_ENV

    - name: Build Kernel
      run: |
        chmod +x build_gki_clang.sh
        ./build_gki_clang.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GKI-Kernel-5.15-Gunyah
        path: out/dist/*
        retention-days: 30