name: Build GKI with Clang (Native Compile)

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    permissions:
      contents: read

    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Free Disk Space
      run: |
        sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost $AGENT_TOOLSDIRECTORY /usr/local/lib/android
        sudo docker image prune --all --force || true
        df -h

    - name: Setup Swap
      run: |
        sudo swapoff /swapfile 2>/dev/null || true
        sudo rm -f /swapfile
        sudo fallocate -l 8G /swapfile
        sudo chmod 600 /swapfile
        sudo mkswap /swapfile
        sudo swapon /swapfile
        free -h

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          git zip unzip curl wget python3 bc rsync \
          cpio ncurses-dev libxml2-utils build-essential \
          flex bison libssl-dev libelf-dev \
          clang llvm lld
        clang --version

    - name: Build Kernel with Clang
      run: |
        chmod +x build_gki_clang.sh
        ./build_gki_clang.sh

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GKI-Kernel-5.15-Gunyah
        path: |
          out/dist/*
        retention-days: 30